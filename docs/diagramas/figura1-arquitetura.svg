<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" width="1280" height="770" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1280" height="770" fill="#ffffff"/>

  <!-- CI -->
  <rect x="30" y="20" width="1220" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="50" y="50" font-size="17" font-weight="bold" fill="#0f172a">GitHub Actions (runner ubuntu-latest), a cada push</text>
  <text x="50" y="80" font-size="14" fill="#334155">1. docker compose up --build -d   →   2. aguarda GET /api/saude   →   3. npm run seed   →   4. executa a suíte de tests/   →   5. salva os relatórios como artifacts</text>

  <!-- Suite -->
  <rect x="30" y="150" width="310" height="476" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="50" y="178" font-size="17" font-weight="bold" fill="#14532d">Suíte do grupo: pasta tests/</text>
  <g font-size="13" fill="#14532d">
    <rect x="50" y="195" width="270" height="70" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="64" y="222" font-size="15" font-weight="bold">tests/e2e</text>
    <text x="64" y="245">Playwright + Page Objects (5 fluxos)</text>

    <rect x="50" y="279" width="270" height="70" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="64" y="306" font-size="15" font-weight="bold">tests/a11y</text>
    <text x="64" y="329">@axe-core/playwright + teclado</text>

    <rect x="50" y="363" width="270" height="70" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="64" y="390" font-size="15" font-weight="bold">tests/api</text>
    <text x="64" y="413">Jest + Supertest · pdf-parse</text>

    <rect x="50" y="447" width="270" height="70" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="64" y="474" font-size="15" font-weight="bold">tests/bdd</text>
    <text x="64" y="497">Cucumber.js (Gherkin em português)</text>

    <rect x="50" y="531" width="270" height="70" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="64" y="558" font-size="15" font-weight="bold">tests/carga</text>
    <text x="64" y="581">k6 · 50 VUs · p95 &lt; 800 ms</text>
  </g>

  <!-- Compose -->
  <rect x="450" y="150" width="380" height="476" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="470" y="178" font-size="17" font-weight="bold" fill="#1e3a8a">Docker Compose: MedAgenda 1.0</text>
  <g font-size="13" fill="#1e3a8a">
    <rect x="490" y="200" width="300" height="84" rx="6" fill="#fff" stroke="#2563eb"/>
    <text x="506" y="228" font-size="15" font-weight="bold">web</text>
    <text x="506" y="250">React 18 + Vite, servido por Nginx</text>
    <text x="506" y="270">localhost:8080</text>

    <rect x="490" y="345" width="300" height="104" rx="6" fill="#fff" stroke="#2563eb"/>
    <text x="506" y="373" font-size="15" font-weight="bold">api</text>
    <text x="506" y="395">Node.js 20 + Express + Mongoose</text>
    <text x="506" y="415">JWT (8 h) · PDFs com pdfkit</text>
    <text x="506" y="435">localhost:3000/api</text>

    <rect x="490" y="510" width="300" height="84" rx="6" fill="#fff" stroke="#2563eb"/>
    <text x="506" y="538" font-size="15" font-weight="bold">mongo</text>
    <text x="506" y="560">MongoDB 7 · banco medagenda</text>
    <text x="506" y="580">localhost:27017 · seed antes de cada rodada</text>
  </g>
  <line x1="640" y1="284" x2="640" y2="343" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="650" y="318" font-size="12" fill="#475569">REST/JSON + Bearer token</text>
  <line x1="640" y1="449" x2="640" y2="508" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="650" y="483" font-size="12" fill="#475569">Mongoose</text>

  <!-- suite -> containers -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M320,230 L488,236"/>
    <path d="M320,314 L488,250"/>
    <path d="M320,398 L488,386"/>
    <path d="M320,482 L488,400"/>
    <path d="M320,566 L488,414"/>
  </g>
  <text x="352" y="222" font-size="12" fill="#475569">navegador</text>
  <text x="352" y="440" font-size="12" fill="#475569">HTTP</text>

  <!-- Manual -->
  <rect x="950" y="150" width="300" height="300" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="970" y="178" font-size="17" font-weight="bold" fill="#581c87">Testes manuais</text>
  <g font-size="13" fill="#581c87">
    <rect x="970" y="200" width="260" height="84" rx="6" fill="#fff" stroke="#9333ea"/>
    <text x="984" y="226" font-size="15" font-weight="bold">Chrome e Firefox</text>
    <text x="984" y="248">1280 px e 390 px · janela anônima</text>
    <text x="984" y="268">por perfil · sessões exploratórias</text>

    <rect x="970" y="345" width="260" height="84" rx="6" fill="#fff" stroke="#9333ea"/>
    <text x="984" y="371" font-size="15" font-weight="bold">Postman</text>
    <text x="984" y="393">chamadas avulsas com o token</text>
    <text x="984" y="413">de cada um dos 4 perfis</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M970,242 L792,242"/>
    <path d="M970,387 L792,397"/>
  </g>

  <!-- Issues -->
  <rect x="420" y="676" width="440" height="66" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="640" y="703" font-size="16" font-weight="bold" fill="#7c2d12" text-anchor="middle">Issues do GitHub: relatórios de defeito</text>
  <text x="640" y="726" font-size="13" fill="#7c2d12" text-anchor="middle">uma issue por falha, com os campos do modelo 7.2</text>
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M185,626 L185,709 L418,709"/>
    <path d="M1100,450 L1100,709 L862,709"/>
  </g>
  <text x="196" y="664" font-size="12" fill="#475569">falhas</text>
  <text x="1111" y="664" font-size="12" fill="#475569">falhas</text>

  <!-- CI arrows -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M185,106 L185,148"/>
    <path d="M640,106 L640,148"/>
  </g>
  <text x="196" y="133" font-size="12" fill="#475569">executa</text>
  <text x="651" y="133" font-size="12" fill="#475569">sobe e popula</text>
</svg>
